<!DOCTYPE html>
<html>
    <head>
        <title>To Do App</title>
    </head>
    <body>
        <h3>Add Your To Do List Here</h3>

        <form id="myForm">
            <input id="myInput" type="task" placeholder="Enter a task">
            <button>Add</button>
        </form>

        <h3>To Do List</h3> 
        <ul id="myItem"></ul>


        <script>
            var myForm = document.getElementById("myForm");
            var myInput = document.getElementById("myInput");
            var myItem = document.getElementById("myItem");

            myForm.addEventListener("submit," function(event) {
                event.preventDefault();
                createItem(myInput.value);
            })

            function createItem(inputitems) {
                var items = <li>${inputitems}
                    <button onclick="deleteElement(this)">Delete</button>
                    </li>;

                    myItem,insertAdjacentHTML("beforeend", items);

                    myInput.value = "";
                    myInput.focus();
            }

            function deleteElement(ElementToDelete) {
                ElementToDelete.parentElemnt.remove();
            }

        </script>
    </body>
</html>
